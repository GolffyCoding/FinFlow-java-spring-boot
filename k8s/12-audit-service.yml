apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: finflow
  labels:
    app: audit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit
          image: finflow/audit-service:1.0.0
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: finflow-config
            - secretRef:
                name: finflow-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: finflow
spec:
  selector:
    app: audit-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
