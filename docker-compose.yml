version: '3.8'

services:
  # Infrastructure
  eureka-server:
    image: steeltoeoss/eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - finflow-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - finflow-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - finflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - finflow-network

  oracle:
    image: gvenzl/oracle-xe:21-slim
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=finflow123
      - APP_USER=finflow
      - APP_USER_PASSWORD=finflow123
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - finflow-network

  # Alternative database backend. Not started by default — bring up with
  # `docker compose -f docker-compose.yml -f docker-compose.sqlserver.yml --profile sqlserver up -d`
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Finflow123!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finflow-network

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    profiles: ["sqlserver"]
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'Finflow123!' -C -Q \"IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'finflow') CREATE DATABASE finflow\" &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'Finflow123!' -C -Q \"IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = 'finflow_app') EXEC('CREATE LOGIN finflow_app WITH PASSWORD = ''FinflowSql123456''')\" &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'Finflow123!' -C -d finflow -Q \"IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'finflow_app') CREATE USER finflow_app FOR LOGIN finflow_app; ALTER ROLE db_owner ADD MEMBER finflow_app;\"
      "
    networks:
      - finflow-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - finflow-network

  # Microservices
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - REDIS_HOST=redis
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - redis
    networks:
      - finflow-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - DB_USERNAME=finflow
      - DB_PASSWORD=finflow123
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - DB_DIALECT=org.hibernate.dialect.OracleDialect
      - REDIS_HOST=redis
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - oracle
      - redis
    networks:
      - finflow-network

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - DB_USERNAME=finflow
      - DB_PASSWORD=finflow123
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - DB_DIALECT=org.hibernate.dialect.OracleDialect
      - REDIS_HOST=redis
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - oracle
      - redis
    networks:
      - finflow-network

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - DB_USERNAME=finflow
      - DB_PASSWORD=finflow123
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - DB_DIALECT=org.hibernate.dialect.OracleDialect
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - oracle
      - kafka
    networks:
      - finflow-network

  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - DB_USERNAME=finflow
      - DB_PASSWORD=finflow123
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - DB_DIALECT=org.hibernate.dialect.OracleDialect
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ML_SERVICE_URL=http://fraud-ml:8000
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - oracle
      - kafka
      - fraud-ml
    networks:
      - finflow-network

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - DB_USERNAME=finflow
      - DB_PASSWORD=finflow123
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - DB_DIALECT=org.hibernate.dialect.OracleDialect
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - oracle
      - kafka
    networks:
      - finflow-network

  fraud-ml:
    build:
      context: ./fraud-ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - finflow-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - DB_USERNAME=finflow
      - DB_PASSWORD=finflow123
      - DB_DRIVER=oracle.jdbc.OracleDriver
      - DB_DIALECT=org.hibernate.dialect.OracleDialect
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - JWT_SECRET=finflow-super-secret-key-2024-very-long-and-secure
    depends_on:
      - eureka-server
      - oracle
      - kafka
      - mailhog
    networks:
      - finflow-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - finflow-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - finflow-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - finflow-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - finflow-network

volumes:
  redis-data:
  oracle-data:
  sqlserver-data:
  prometheus-data:
  grafana-data:

networks:
  finflow-network:
    driver: bridge
