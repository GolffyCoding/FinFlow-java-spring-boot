name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'FinFlow'
          path: '.'
          format: 'ALL'
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          # Trivy's Java/pom analyzer walks the full parent/import POM chain against
          # Maven Central over the network regardless of what's in the local ~/.m2 cache.
          # Under CI that trips Central's rate limiter (HTTP 429) and fails the scan.
          # --offline-scan disables all of those live lookups; it only affects package
          # metadata resolution, not the vulnerability DB download above.
          TRIVY_OFFLINE_SCAN: true
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
