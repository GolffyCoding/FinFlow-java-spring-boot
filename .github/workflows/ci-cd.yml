name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: finflow

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Parent POM
        run: mvn -N install

      - name: Build Shared Library
        run: cd shared-lib && mvn clean install -DskipTests && cd ..

      - name: Build & Test All Services
        run: |
          for service in api-gateway auth-service account-service transaction-service fraud-service notification-service audit-service; do
            echo "Building $service..."
            cd $service && mvn clean verify && cd ..
          done

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '*/target/surefire-reports/*.xml'

  sonarqube:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        timeout-minutes: 5

  build-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: auth-service
            context: .
            dockerfile: auth-service/Dockerfile
          - service: account-service
            context: .
            dockerfile: account-service/Dockerfile
          - service: transaction-service
            context: .
            dockerfile: transaction-service/Dockerfile
          - service: fraud-service
            context: .
            dockerfile: fraud-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: notification-service/Dockerfile
          - service: audit-service
            context: .
            dockerfile: audit-service/Dockerfile
          - service: fraud-ml
            context: ./fraud-ml
            dockerfile: fraud-ml/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name finflow-cluster --region ap-southeast-1

      - name: Deploy to Kubernetes
        run: |
          cd k8s
          for file in *.yml; do
            envsubst < $file | kubectl apply -f -
          done

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/api-gateway -n finflow
          kubectl rollout status deployment/auth-service -n finflow
          kubectl rollout status deployment/account-service -n finflow
          kubectl rollout status deployment/transaction-service -n finflow
          kubectl rollout status deployment/fraud-service -n finflow
          kubectl rollout status deployment/notification-service -n finflow
          kubectl rollout status deployment/audit-service -n finflow
