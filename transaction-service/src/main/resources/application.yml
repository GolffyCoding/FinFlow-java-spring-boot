server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle:1521/FINFLOW}
    username: ${DB_USERNAME:finflow}
    password: ${DB_PASSWORD:finflow123}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.OracleDialect}
        format_sql: true
        timezone:
          default_storage: NORMALIZE
  flyway:
    enabled: true
    table: flyway_schema_history_transaction
    locations: classpath:db/migration/${DB_VENDOR:oracle}
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      properties:
        linger.ms: 5
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.finflow.transaction: DEBUG
    org.springframework.kafka: INFO

jwt:
  secret: ${JWT_SECRET:finflow-super-secret-key-2024-very-long-and-secure}
